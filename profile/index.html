<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام أثر | الهوية المدرسية الذكية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="../redesign.css" />
</head>
<body data-view="profile">
  <main id="student-portal-view" class="container" style="display: none;">
    <div class="portal-layout">
      <header class="smart-id-card portal-hero">
        <div class="id-card-header">
          <span class="id-card-tag">أثر / الملف الطلابي</span>
        </div>
        <div class="id-card-body">
          <div class="id-card-info">
            <h1 id="portal-student-name" dir="auto">—</h1>
            <small class="field-label">الصف والشعبة</small>
            <p id="portal-student-grade">—</p>
          </div>
        </div>
      </header>

    <section class="panel portal-section">
      <h2>الإنجازات والشهادات</h2>
      <div id="portal-achievements-list" class="achievements-grid"></div>

      </section>
</div>
  </main>

<script src="../app.js"></script>
</body>
</html>
