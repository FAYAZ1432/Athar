<!doctype html>
<html data-student="noura" lang="ar" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملف الطالب | أثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap"><link rel="stylesheet" href="../profile.css">
<main><nav><strong>أثر</strong><span class="muted">نموذج تجريبي · بيانات وهمية</span></nav>
<section id="profile" hidden><header class="hero"><span class="badge">الملف الطلابي</span><h1 id="name"></h1><div id="grade"></div><img id="portrait" alt="الصورة الشخصية" hidden><p id="bio-text" dir="auto" hidden></p></header>
<section class="panel row" aria-label="تخصيص الملف"><label for="theme">مظهر الصفحة</label><select id="theme"><option value="forest">الغابة</option><option value="night">سماء الليل</option><option value="clay">الطين</option></select></section>

<details class="panel" id="edit"><summary>تعديل الملف التجريبي</summary><form class="editor" id="editor"><label>نبذة عني <textarea id="bio" maxlength="500" rows="4" dir="auto"></textarea></label><label>صورة اختيارية (JPEG / PNG / WebP، حتى 512 كيلوبايت)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label><input id="remove-photo" type="checkbox"> إزالة الصورة</label><button type="submit">حفظ</button><p role="status" id="feedback"></p></form></details><section class="panel"><h2>الإنجازات</h2><p id="award"></p></section></section>
<section id="missing" class="panel" hidden><h1>الملف غير موجود</h1><p>جرّب أحد الملفات التجريبية أدناه.</p></section>
<footer class="row"><span>ملفات تجريبية أخرى</span><span><a href="../noura/">نورة</a> · <a href="../omar/">عمر</a></span></footer></main>
<script src="../profile.js"></script>
</html>
